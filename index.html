<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Xavier Ruiz</title>
  <meta name="description" content="Xavier Ruiz, Product Marketing @ ServiceNow. Boston, MA.">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&family=Martian+Mono:wght@400..500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Front page: Space Cowboy, drawn in characters. -->
  <canvas id="ascii" aria-hidden="true"></canvas>
  <!-- Mycelium: a living network. -->
  <canvas id="base" aria-hidden="true"></canvas>
  <canvas id="over" aria-hidden="true"></canvas>

  <header class="intro" id="intro">
    <h1 class="intro__name">Xavier Ruiz</h1>
    <p class="intro__role" data-role></p>
  </header>

  <p class="corner corner--tl" data-place></p>
  <button class="corner corner--bl" id="open-index" type="button">Projects</button>
  <button class="corner corner--br" id="open-contact" type="button">Contact</button>

  <article class="project" id="project" aria-labelledby="p-title" hidden>
    <button class="project__back" id="p-back" type="button">Back</button>
    <div class="project__text" id="p-text">
      <p class="project__meta" id="p-meta"></p>
      <h2 id="p-title"></h2>
      <p class="project__summary" id="p-summary"></p>
      <div class="project__actions">
        <a class="project__link" id="p-link" href="#" target="_blank" rel="noopener">Open</a>
        <button class="project__restart" id="p-restart" type="button">Start over</button>
        <button class="project__next" id="p-next" type="button">Next</button>
      </div>
    </div>
  </article>

  <section class="sheet" id="sheet-index" aria-label="Projects" hidden>
    <button class="close" type="button" data-close>Close</button>
    <ol class="index" id="index-list"></ol>
  </section>

  <section class="sheet" id="sheet-contact" aria-label="Contact" hidden>
    <button class="close" type="button" data-close>Close</button>
    <div class="contact">
      <ul class="contact__links" id="links"></ul>
    </div>
  </section>

  <noscript><p class="noscript">Xavier Ruiz — Product Marketing @ ServiceNow</p></noscript>

  <script src="js/colormaps.js"></script>
  <script src="js/palettes.js"></script>
  <script src="js/organism.js"></script>
  <script src="js/ascii.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
