<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Your Name — Job Title</title>
  <meta name="description" content="Your Name, Job Title.">
  <meta name="theme-color" content="#040208">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="base" aria-hidden="true"></canvas>
  <canvas id="over" aria-hidden="true"></canvas>

  <h1 class="sr-only"><span data-name></span>, <span data-role></span></h1>
  <p class="role" id="role" aria-hidden="true" data-role></p>

  <div class="spores" id="spores"></div>

  <div class="corner corner--tl" aria-hidden="true">
    <span data-place></span>
    <span class="clock" id="clock"></span>
  </div>
  <button class="corner corner--bl" id="open-index" type="button">Index <span class="count" id="count"></span></button>
  <button class="corner corner--br" id="open-contact" type="button">Contact</button>

  <section class="sheet" id="sheet-index" aria-label="Index" hidden>
    <button class="close" type="button" data-close>Close</button>
    <ol class="index" id="index-list"></ol>
  </section>

  <section class="sheet" id="sheet-contact" aria-label="Contact" hidden>
    <button class="close" type="button" data-close>Close</button>
    <div class="contact">
      <a class="contact__mail" id="mail" href="#"></a>
      <ul class="contact__links" id="links"></ul>
    </div>
  </section>

  <section class="sheet sheet--project" id="sheet-project" aria-labelledby="p-title" hidden>
    <button class="close" type="button" data-close>Close</button>
    <article class="project">
      <header class="project__head">
        <h2 id="p-title"></h2>
        <dl class="project__meta">
          <div><dt>Type</dt><dd id="p-type"></dd></div>
          <div><dt>Year</dt><dd id="p-year"></dd></div>
          <div><dt>Role</dt><dd id="p-role"></dd></div>
        </dl>
      </header>
      <p class="project__summary" id="p-summary"></p>
      <div class="project__media">
        <div class="frame frame--wide"></div>
        <div class="frame"></div>
        <div class="frame"></div>
      </div>
      <button class="next" type="button" id="p-next"></button>
    </article>
  </section>

  <noscript><p class="noscript">Your Name — Job Title</p></noscript>

  <script src="js/colormaps.js"></script>
  <script src="js/organism.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
